<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="..\obsidian-theme.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
    <link rel="icon" type="image/png" href="../images/icon.png">
</head>

<body>
    <div class="page-bg">
        <img src="../images/back.png" alt="背景" id="bgImage">
    </div>

    <!-- 移动按钮 -->
    <div class="mobile-btn" id="menuToggle">
        <i class="fas fa-bars"></i>
    </div>

    <!-- 容器 -->
    <div class="container">
        <!-- 侧边栏 -->
        <div class="sidebar" id="sidebar">
            <!-- 头像 -->
            <div class="avatar">
                <img src="../images/icon.png" alt="头像">
            </div>

            <!-- 信息卡片 -->
            <div class="card">
                <div class="info-row">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>中国 · 湖北</span>
                </div>
                <div class="info-row">
                    <i class="fas fa-graduation-cap"></i>
                    <span>湖北孝感美JA职院</span>
                </div>
                <div class="tag-group">
                    <span class="tag">网瘾</span>
                    <span class="tag">XXS</span>
                    <span class="tag">大一</span>
                    <span class="tag">MOBA</span>
                    <span class="tag">GAME</span>
                    <span class="tag">抖音</span>
                    <span class="tag">前端</span>
                    <span class="tag">算法</span>
                    <span class="tag">html</span>
                    <span class="tag">C/C++</span>
                    <span class="tag">Java</span>
                    <span class="tag">JavaScript</span>
                </div>
            </div>

            <!-- 时间轴 -->
            <div class="card">
                <div class="timeline">
                    <div class="item active">
                        <div class="dot"></div>
                        <div class="con">
                            <p>2026-04</p>
                            <small>学习进行中...</small>
                        </div>
                    </div>
                    <div class="item">
                        <div class="dot"></div>
                        <div class="con">
                            <p>2023-08</p>
                            <small>努力学习</small>
                        </div>
                    </div>
                    <div class="item">
                        <div class="dot"></div>
                        <div class="con">
                            <p>2022-02</p>
                            <small>走火入魔</small>
                        </div>
                    </div>
                    <div class="item">
                        <div class="dot"></div>
                        <div class="con">
                            <p>2020-01</p>
                            <small>初次见面</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 主内容 -->
        <div class="main">
            <div class="main-inner">
                <!-- 个人信息 -->
                <div class="profile">
                    <h1>你好，我是 <span class="name">Mo Yan</span></h1>
                    <div class="bio">
                        <p><i class="fas fa-code"></i> 前端开发者</p>
                        <p><i class="fas fa-gamepad"></i> 游戏爱好者</p>
                        <p><i class="fas fa-music"></i> 音乐发烧友</p>
                    </div>
                </div>

                <!-- 功能区域 -->
                <div class="section">
                    <div class="section-title">
                        <i class="fas fa-tools"></i> 功能工具
                    </div>
                    
                    <!-- QQ查询 -->
                    <div class="function-card" id="qbindCard">
                        <div class="function-header">
                            <h3><i class="fas fa-question-circle"></i> QQ查询</h3>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="function-content">
                            <div class="form-group">
                                <label for="queryType">查询类型</label>
                                <select id="queryType" class="form-control">
                                    <option value="qq2phone">QQ账号查询手机号</option>
                                    <option value="phone2qq">手机号查询QQ账号</option>
                                    <option value="wbuid2phone">微博UID查询手机号</option>
                                    <option value="phone2wbuid">手机号查询微博UID</option>
                                    <option value="lolname2qq">英雄联盟昵称查询QQ</option>
                                    <option value="qq2lolname">QQ查询英雄联盟昵称</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="queryInput" id="queryInputLabel">QQ号码</label>
                                <input type="text" id="queryInput" placeholder="请输入QQ号码">
                            </div>
                            <button class="btn" id="qbindBtn">查询</button>
                            <div class="form-group">
                                <label for="qbindResult">查询结果</label>
                                <textarea id="qbindResult" readonly placeholder="查询结果将显示在这里" style="min-height: 120px;"></textarea>
                                <button class="btn copy-btn" id="copyQbindResultBtn" style="display: none;">复制</button>
                            </div>
                        </div>
                    </div>

                    <!-- 城市天气查询 -->
                    <div class="function-card" id="weatherCard">
                        <div class="function-header">
                            <h3><i class="fas fa-cloud-sun"></i> 城市天气查询</h3>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="function-content">
                            <div class="form-group">
                                <label for="cityName">城市名称</label>
                                <input type="text" id="cityName" placeholder="请输入城市名称">
                            </div>
                            <button class="btn" id="weatherBtn">查询</button>
                            <div class="result" id="weatherResult"></div>
                        </div>
                    </div>

                    <!-- Base64加密解密 -->
                    <div class="function-card" id="base64Card">
                        <div class="function-header">
                            <h3><i class="fas fa-lock"></i> Base64加密解密</h3>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="function-content">
                            <div class="form-group">
                                <label for="base64Input">输入内容</label>
                                <textarea id="base64Input" placeholder="请输入要加密或解密的内容"></textarea>
                            </div>
                            <div class="btn-group">
                                <button class="btn" id="encodeBtn">加密</button>
                                <button class="btn" id="decodeBtn">解密</button>
                            </div>
                            <div class="form-group">
                                <label for="base64Output">输出结果</label>
                                <textarea id="base64Output" readonly placeholder="结果将显示在这里"></textarea>
                                <button class="btn copy-btn" id="copyBtn">复制</button>
                            </div>
                        </div>
                    </div>

                    <!-- 舔狗日记生成 -->
                    <div class="function-card" id="dogDiaryCard">
                        <div class="function-header">
                            <h3><i class="fas fa-heart"></i> 舔狗日记生成</h3>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="function-content">
                            <button class="btn" id="generateDogDiaryBtn">生成日记</button>
                            <div class="form-group">
                                <label for="dogDiaryOutput">舔狗日记</label>
                                <textarea id="dogDiaryOutput" readonly placeholder="点击生成按钮获取舔狗日记"></textarea>
                                <button class="btn copy-btn" id="copyDogDiaryBtn">复制</button>
                            </div>
                        </div>
                    </div>

                    <!-- 快递物流查询 -->
                    <div class="function-card" id="expressCard">
                        <div class="function-header">
                            <h3><i class="fas fa-truck"></i> 快递物流查询</h3>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="function-content">
                            <div class="form-group">
                                <label for="trackingNumber">快递单号</label>
                                <input type="text" id="trackingNumber" placeholder="请输入快递单号">
                            </div>
                            <div class="form-group">
                                <label for="carrierCode">快递公司编码（可选）</label>
                                <input type="text" id="carrierCode" placeholder="如：yunda、sf等">
                            </div>
                            <button class="btn" id="queryExpressBtn">查询</button>
                            <div class="result" id="expressResult"></div>
                        </div>
                    </div>

                </div>

                <!-- 页脚 -->
                <footer>
                    <p>&copy; 2026 个人主页. All rights reserved.</p>
                </footer>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        if (window.renderMathInElement) {
          window.renderMathInElement(document.body, {
            delimiters: [
              {left: "$$", right: "$$", display: true},
              {left: "$", right: "$", display: false},
              {left: "\\(", right: "\\)", display: false},
              {left: "\\[", right: "\\]", display: true}
            ],
            throwOnError: false
          });
        }
      });
    </script>
</body>

</html>
