<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="../images/icon.png">
</head>

<body>
    <!-- 背景视频 -->
    <div class="page-bg">
        <img src="../images/back.png" alt="背景" id="bgImage">
    </div>

    <!-- 移动按钮 -->
    <div class="mobile-btn" id="menuToggle">
        <i class="fas fa-bars"></i>
    </div>

    <!-- 容器 -->
    <div class="container">
        <!-- 侧边栏 -->
        <div class="sidebar" id="sidebar">
            <!-- 头像 -->
            <div class="avatar">
                <img src="../images/icon.png" alt="头像">
            </div>

            <!-- 信息卡片 -->
            <div class="card">
                <div class="info-row">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>中国 · 湖北</span>
                </div>
                <div class="info-row">
                    <i class="fas fa-graduation-cap"></i>
                    <span>湖北孝感美JA职院</span>
                </div>
                <div class="tag-group">
                    <span class="tag">网瘾</span>
                    <span class="tag">XXS</span>
                    <span class="tag">大一</span>
                    <span class="tag">MOBA</span>
                    <span class="tag">GAME</span>
                    <span class="tag">抖音</span>
                    <span class="tag">前端</span>
                    <span class="tag">算法</span>
                    <span class="tag">html</span>
                    <span class="tag">C/C++</span>
                    <span class="tag">Java</span>
                    <span class="tag">JavaScript</span>
                </div>
            </div>

            <!-- 时间轴 -->
            <div class="card">
                <div class="timeline">
                    <div class="item active">
                        <div class="dot"></div>
                        <div class="con">
                            <p>2026-04</p>
                            <small>学习进行中...</small>
                        </div>
                    </div>
                    <div class="item">
                        <div class="dot"></div>
                        <div class="con">
                            <p>2023-08</p>
                            <small>努力学习</small>
                        </div>
                    </div>
                    <div class="item">
                        <div class="dot"></div>
                        <div class="con">
                            <p>2022-02</p>
                            <small>走火入魔</small>
                        </div>
                    </div>
                    <div class="item">
                        <div class="dot"></div>
                        <div class="con">
                            <p>2020-01</p>
                            <small>初次见面</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 主内容 -->
        <div class="main">
            <div class="main-inner">
                <!-- 个人信息 -->
                <div class="profile">
                    <h1>你好，我是 <span class="name">Mo Yan</span></h1>
                    <div class="bio">
                        <p><i class="fas fa-code"></i> 前端开发者</p>
                        <p><i class="fas fa-gamepad"></i> 游戏爱好者</p>
                        <p><i class="fas fa-music"></i> 音乐发烧友</p>
                    </div>
                </div>

                <!-- 文章区域 -->
                <div class="section">
                    <div class="section-title">
                        <i class="fas fa-file-alt"></i> 文章
                    </div>
                    <div class="card" id="articleList">
                        <div class="loading">加载中...</div>
                    </div>
                </div>

                <!-- 页脚 -->
                <footer>
                    <p>&copy; 2026 个人主页. All rights reserved.</p>
                </footer>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function loadArticle() {
            fetch('../backend/api/article')
                .then(response => response.json())
                .then(data => {
                    const articleList = document.getElementById('articleList');
                    articleList.innerHTML = '';

                    if (data.length === 0) {
                        articleList.innerHTML = '<p>暂无文章内容</p>';
                        return;
                    }

                    // 按日期排序
                    data.sort((a, b) => new Date(b.date) - new Date(a.date));

                    data.forEach(item => {
                        const articleItem = document.createElement('div');
                        articleItem.className = 'article-item';

                        // 修复日期显示
                        const date = new Date(item.date);
                        if (isNaN(date.getTime())) {
                            // 如果日期无效，显示原始日期字符串
                            var formattedDate = item.date;
                        } else {
                            var formattedDate = date.toLocaleString('zh-CN', {
                                year: 'numeric',
                                month: '2-digit',
                                day: '2-digit',
                                hour: '2-digit',
                                minute: '2-digit'
                            });
                        }

                        // 处理内容省略和换行
        const maxLength = 100;
        let content = item.content;
        // 处理换行符
        content = content.replace(/\n/g, '<br>');
        const isLong = content.length > maxLength;
        const displayContent = isLong ? content.substring(0, maxLength) + '...' : content;

                        articleItem.innerHTML = `
                            <div class="date">${formattedDate}</div>
                            <h3>${item.title}</h3>
                            <p class="content">${displayContent}</p>
                            ${isLong ? `<p class="full-content" style="display: none;">${content}</p>` : ''}
                            ${item.image ? `<img src="../backend/public${item.image}" alt="文章图片">` : ''}
                            ${isLong ? `<button class="toggle-btn">更多</button>` : ''}
                        `;

                        articleList.appendChild(articleItem);
                    });

                    // 添加展开/收起功能
                    document.querySelectorAll('.toggle-btn').forEach(btn => {
                        btn.addEventListener('click', function () {
                            const articleItem = this.closest('.article-item');
                            const content = articleItem.querySelector('.content');
                            const fullContent = articleItem.querySelector('.full-content');

                            if (fullContent.style.display === 'none') {
                                content.style.display = 'none';
                                fullContent.style.display = 'block';
                                this.textContent = '收起';
                            } else {
                                content.style.display = 'block';
                                fullContent.style.display = 'none';
                                this.textContent = '更多';
                            }
                        });
                    });
                })
                .catch(error => {
                    console.error('加载文章失败:', error);
                    document.getElementById('articleList').innerHTML = '<p>加载失败，请稍后重试</p>';
                });
        }

        window.onload = loadArticle;
    </script>
</body>

</html>
